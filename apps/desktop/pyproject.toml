[project]
name = "bioimage-app"
version = "0.9.0"
description = "Explicit desktop host assembly"
requires-python = ">=3.12,<3.13"
dependencies = ["platform-runtime", "tool-contracts", "PySide6==6.12.0"]

[project.optional-dependencies]
wb = ["wb-tool[desktop,ocr]"]

[tool.uv.sources]
platform-runtime = { workspace = true }
tool-contracts = { workspace = true }
wb-tool = { workspace = true }

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bioimage_app"
