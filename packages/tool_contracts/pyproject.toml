[project]
name = "tool-contracts"
version = "0.1.0"
description = "Narrow immutable asset and run contracts"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.1"]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tool_contracts"
