[project]
name = "wb-tool"
version = "0.3.0"
description = "WB reference profile quantification domain"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "tifffile==2026.9.20"]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wb_tool"
