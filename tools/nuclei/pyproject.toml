[project]
name = "nuclei-tool"
version = "0.1.0"
description = "Fixed, explicitly unvalidated StarDist nuclei research adapter"
requires-python = ">=3.12,<3.13"
dependencies = ["tool-contracts", "numpy==2.5.4", "pillow>=12.3,<14"]

[tool.uv.sources]
tool-contracts = { workspace = true }

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nuclei_tool"
