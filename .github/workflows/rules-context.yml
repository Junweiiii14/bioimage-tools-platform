name: rules-context
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: rules-context-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules-context:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify context against the exact PR base and head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -I tooling/rule_context.py check --base "$BASE_SHA" --head "$HEAD_SHA"
